<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Object Store</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --dim: #6b6a65; --line: #dddbd3;
    --ok: #1f7a4d; --ok-bg: #e3f3ea; --bad: #b3261e; --bad-bg: #fbe6e4;
    --warn: #8a5a00; --warn-bg: #fbf0d5; --off: #77756f; --off-bg: #ebe9e2; --accent: #2f5fd0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --card: #20201d; --ink: #ecebe6; --dim: #9d9b94; --line: #35342f;
      --ok: #6fd39d; --ok-bg: #173526; --bad: #ff8a80; --bad-bg: #40191a;
      --warn: #f0c060; --warn-bg: #3a2c0c; --off: #a09e97; --off-bg: #2b2a26; --accent: #8fb0ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .stats { display: flex; gap: 20px; flex-wrap: wrap; color: var(--dim); }
  .stats b { color: var(--ink); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .workers { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .worker .name { font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .worker .num { font-size: 26px; font-weight: 600; margin-top: 6px; }
  .worker .sub { color: var(--dim); font-size: 12px; }
  .worker.dead { border-color: var(--bad); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .ok { color: var(--ok); background: var(--ok-bg); }
  .bad { color: var(--bad); background: var(--bad-bg); }
  .warn { color: var(--warn); background: var(--warn-bg); }
  .off { color: var(--off); background: var(--off-bg); }
  .cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
  .stack { display: grid; gap: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--dim); padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tbody tr.pick { background: var(--off-bg); }
  tbody tr.row { cursor: pointer; }
  .name-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .dim { color: var(--dim); }
  .right { text-align: right; }
  .center { text-align: center; }
  button, .btn { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { border-color: var(--dim); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button.primary { color: #111; } }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text] { font: inherit; font-size: 13px; padding: 5px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; }
  form.line { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  form.line input[type=text] { flex: 1 1 140px; }
  .msg { font-size: 13px; margin-top: 8px; min-height: 20px; }
  .events { max-height: 320px; overflow: auto; font-size: 13px; }
  .events div { padding: 4px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  .events div:last-child { border-bottom: 0; }
  .events time { color: var(--dim); flex: none; font-variant-numeric: tabular-nums; }
  .kv { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .kv span { background: var(--off-bg); border-radius: 6px; padding: 2px 8px; font-size: 12px; }
  .empty { color: var(--dim); padding: 12px 0; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .head h2 { margin: 0; }
  #preview video, #preview img { width: 100%; max-height: 280px; border-radius: 8px; background: #000; display: block; margin-bottom: 12px; object-fit: contain; }
  #preview audio { width: 100%; margin-bottom: 12px; }
  #part { margin-bottom: 14px; }
  #part .lbl { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  #part input { flex: 1 1 90px; }
  button.mini { padding: 1px 8px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Mini Distributed Cloud Object Store</h1>
    <div class="stats" id="stats"></div>
  </header>

  <section class="workers" id="workers" aria-label="Storage workers"></section>

  <div class="cols">
    <div class="stack">
      <section class="card">
        <h2>Upload</h2>
        <form class="line" id="up">
          <input type="file" id="file" required aria-label="File to upload">
          <input type="text" id="upmeta" placeholder="metadata: owner=dev, course=cloud" aria-label="Custom metadata">
          <button class="primary" id="upbtn">Upload</button>
        </form>
        <div class="msg" id="upmsg" role="status"></div>
      </section>

      <section class="card">
        <h2>Objects</h2>
        <div id="objects"></div>
      </section>
    </div>

    <div class="stack">
      <section class="card">
        <h2>Chunk map</h2>
        <div id="preview"></div>
        <div id="part"></div>
        <div id="detail"><div class="empty">Select an object to see where its chunks are stored.</div></div>
      </section>

      <section class="card">
        <div class="head">
          <h2>Events</h2>
          <button id="scrub" title="Re-check every stored chunk against its checksum">Scrub now</button>
        </div>
        <div class="events" id="events"></div>
      </section>
    </div>
  </div>
</main>

<script>
const API = '/api/v1';
const $ = id => document.getElementById(id);
let sel = null, armed = null;

// tiny DOM builder: el('td', {class: 'x'}, 'text', childNode)
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  for (const k of kids) if (k !== null && k !== undefined) e.append(k);
  return e;
}

function size(n) {
  if (n < 1024) return n + ' B';
  const u = ['KB', 'MB', 'GB'];
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < 2);
  return n.toFixed(1) + ' ' + u[i];
}

async function get(path) {
  const r = await fetch(API + path + (path.includes('?') ? '&' : '?') + 'poll=1', {cache: 'no-store'});
  if (!r.ok) throw new Error((await r.json()).error.message);
  return r.json();
}

function parseMeta(s) {
  const kv = {};
  for (const part of s.split(',')) {
    const p = part.trim();
    if (!p) continue;
    const i = p.indexOf('=');
    if (i < 1) throw new Error(`"${p}" should look like key=value`);
    kv[p.slice(0, i).trim()] = p.slice(i + 1).trim();
  }
  return kv;
}

function drawCluster(c) {
  $('stats').replaceChildren(
    c.mode === 'recovering' ? el('span', {class: 'pill warn', title: 'The controller just started and is collecting chunk locations from the workers'}, 'safe mode: rebuilding chunk map') : '',
    el('span', null, el('b', null, c.objects), ' objects'),
    el('span', null, el('b', null, c.chunks), ' chunks'),
    el('span', null, 'replication ', el('b', null, c.replication_factor)),
    el('span', null, el('b', null, c.under_replicated_chunks), ' under-replicated'),
    el('span', null, el('b', null, c.corrupt_copies), ' corrupt copies'),
  );
  $('workers').replaceChildren(...c.workers.map(w => {
    const up = w.status === 'alive';
    return el('div', {class: 'card worker' + (up ? '' : ' dead')},
      el('div', {class: 'name'}, w.worker_id, el('span', {class: 'pill ' + (up ? 'ok' : 'bad')}, up ? 'alive' : 'down')),
      el('div', {class: 'num'}, w.chunks, el('span', {class: 'sub'}, ' chunks')),
      el('div', {class: 'sub'}, `heartbeat ${w.last_heartbeat_seconds_ago}s ago`),
    );
  }));
  if (!c.workers.length) $('workers').replaceChildren(el('div', {class: 'card empty'}, 'No workers have registered yet.'));
}

function drawObjects(d) {
  if (!d.objects.length) {
    $('objects').replaceChildren(el('div', {class: 'empty'}, 'Nothing stored yet. Upload a file to start.'));
    return;
  }
  const rows = d.objects.map(o => el('tr', {class: 'row' + (o.object_id === sel ? ' pick' : ''), on: {click: () => { sel = o.object_id; tick(); }}},
    el('td', {class: 'name-cell', title: o.name}, o.name),
    el('td', {class: 'right'}, size(o.size)),
    el('td', {class: 'center'}, o.chunk_count),
    el('td', {class: 'dim'}, o.content_type),
    el('td', {class: 'right'},
      el('a', {class: 'btn', href: `${API}/objects/${o.object_id}`, on: {click: e => e.stopPropagation()}}, 'Download'), ' ',
      el('button', {class: 'danger', on: {click: e => { e.stopPropagation(); del(o.object_id); }}}, armed === o.object_id ? 'Confirm' : 'Delete'),
    ),
  ));
  $('objects').replaceChildren(el('table', null,
    el('thead', null, el('tr', null, el('th', null, 'Name'), el('th', {class: 'right'}, 'Size'), el('th', {class: 'center'}, 'Chunks'), el('th', null, 'Type'), el('th', null, ''))),
    el('tbody', null, ...rows),
  ), d.total > d.objects.length ? el('div', {class: 'dim'}, `Showing ${d.objects.length} of ${d.total}`) : '');
}

function drawDetail(m, workers) {
  const ws = workers.map(w => w.worker_id);
  const cell = (c, w) => {
    const r = c.replicas.find(r => r.worker === w);
    if (!r) return el('td', {class: 'center dim'}, '·');
    if (!r.alive) return el('td', {class: 'center'}, el('span', {class: 'pill off'}, 'down'));
    if (r.state !== 'ok') return el('td', {class: 'center'}, el('span', {class: 'pill bad'}, 'corrupt'));
    return el('td', {class: 'center'}, el('span', {class: 'pill ok'}, 'copy'));
  };
  const health = c => c.healthy_copies >= m.chunks_needed ? 'ok' : c.healthy_copies ? 'warn' : 'bad';
  let pos = 0;
  const start = m.chunks.map(c => { const at = pos; pos += c.size; return at; });  // first byte of each chunk
  const getChunk = (c, i) => grab(m.object_id, start[i], start[i] + c.size - 1, `${m.name}.chunk-${c.index}`, `chunk #${c.index}`);
  const kv = Object.entries(m.custom_metadata);

  $('detail').replaceChildren(
    el('div', null, el('b', null, m.name), el('span', {class: 'dim'}, ` · ${size(m.size)} · ${m.content_type}`)),
    el('div', {class: 'mono dim'}, 'id ', m.object_id),
    el('div', {class: 'mono dim', title: m.checksum}, 'sha256 ', m.checksum.slice(0, 24), '…', ' · metadata v', m.metadata_version),
    el('div', {class: 'kv'}, ...(kv.length ? kv.map(([k, v]) => el('span', null, `${k} = ${v}`)) : [el('span', {class: 'dim'}, 'no custom metadata')])),
    el('form', {class: 'line', on: {submit: e => patch(e, m.object_id)}},
      el('input', {type: 'text', id: 'pk', placeholder: 'key', 'aria-label': 'Metadata key', required: ''}),
      el('input', {type: 'text', id: 'pv', placeholder: 'value (empty removes the key)', 'aria-label': 'Metadata value'}),
      el('button', null, 'Save'),
    ),
    el('div', {class: 'msg', id: 'pmsg', role: 'status'}),
    m.chunks.length ? el('table', null,
      el('thead', null, el('tr', null, el('th', null, 'Chunk'), el('th', {class: 'right'}, 'Size'), ...ws.map(w => el('th', {class: 'center'}, w)), el('th', {class: 'center'}, 'Healthy'), el('th', null, ''))),
      el('tbody', null, ...m.chunks.map((c, i) => el('tr', null,
        el('td', null, '#' + c.index),
        el('td', {class: 'right dim', style: 'white-space: nowrap'}, size(c.size)),
        ...ws.map(w => cell(c, w)),
        el('td', {class: 'center'}, el('span', {class: 'pill ' + health(c)}, `${c.healthy_copies}/${m.chunks_needed}`)),
        el('td', {class: 'right'}, el('button', {class: 'mini', title: `Download chunk #${c.index} only`, 'aria-label': `Download chunk ${c.index}`, on: {click: () => getChunk(c, i)}}, '\u2193')),
      ))),
    ) : el('div', {class: 'empty'}, 'Empty object, no chunks.'),
  );
}

// The player is drawn once per selection, so refreshes do not restart playback.
// The browser asks for byte ranges, and the store reads only the chunks it needs.
function drawPreview(m) {
  const p = $('preview');
  if (p.dataset.id === m.object_id) return;
  p.dataset.id = m.object_id;
  const src = `${API}/objects/${m.object_id}?inline=1`, t = m.content_type;
  if (t.startsWith('video/')) p.replaceChildren(el('video', {controls: '', preload: 'metadata', src}));
  else if (t.startsWith('audio/')) p.replaceChildren(el('audio', {controls: '', preload: 'metadata', src}));
  else if (t.startsWith('image/')) p.replaceChildren(el('img', {src, alt: m.name}));
  else p.replaceChildren();
}

// ---------- partial downloads ----------
// A plain link cannot send a Range header, so the part is fetched here and
// handed to the browser as a file.
async function grab(id, lo, hi, fname, what) {
  const msg = $('partmsg');
  msg.textContent = `Fetching ${what}\u2026`;
  try {
    const r = await fetch(`${API}/objects/${id}`, {headers: {Range: `bytes=${lo}-${hi}`}, cache: 'no-store'});
    if (!r.ok) throw new Error((await r.json()).error.message);
    const blob = await r.blob();
    const a = el('a', {href: URL.createObjectURL(blob), download: fname});
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    msg.textContent = `Downloaded ${what}: ${size(blob.size)} (${r.headers.get('Content-Range') || `bytes ${lo}-${hi}`}).`;
  } catch (e) {
    msg.textContent = `Could not download ${what}: ${e.message}`;
  }
}

// Drawn once per selection, so the 2-second refresh does not wipe what is typed.
function drawPart(m) {
  const p = $('part');
  if (p.dataset.id === m.object_id) return;
  p.dataset.id = m.object_id;
  if (!m.size) { p.replaceChildren(); return; }
  const go = e => {
    e.preventDefault();
    const a = $('rlo').value.trim(), b = $('rhi').value.trim(), msg = $('partmsg');
    if (!/^\d+$/.test(a) || (b !== '' && !/^\d+$/.test(b))) { msg.textContent = 'Enter whole numbers of bytes, for example 0 and 999.'; return; }
    const lo = Number(a), hi = b === '' ? m.size - 1 : Math.min(Number(b), m.size - 1);
    if (lo >= m.size) { msg.textContent = `The object is ${m.size} bytes long, so the first byte must be below ${m.size}.`; return; }
    if (lo > hi) { msg.textContent = 'The first byte must not be after the last byte.'; return; }
    grab(m.object_id, lo, hi, `${m.name}.bytes-${lo}-${hi}`, `bytes ${lo}-${hi}`);
  };
  p.replaceChildren(
    el('div', {class: 'lbl'}, `Download a part (bytes 0 to ${m.size - 1}), or one chunk with the arrow in its row`),
    el('form', {class: 'line', on: {submit: go}},
      el('input', {type: 'text', id: 'rlo', inputmode: 'numeric', placeholder: 'first byte', 'aria-label': 'First byte', required: '', on: {input: () => { $('partmsg').textContent = ''; }}}),
      el('input', {type: 'text', id: 'rhi', inputmode: 'numeric', placeholder: 'last byte (empty = to the end)', 'aria-label': 'Last byte', on: {input: () => { $('partmsg').textContent = ''; }}}),
      el('button', null, 'Download part'),
    ),
    el('div', {class: 'msg', id: 'partmsg', role: 'status'}),
  );
}

function clearDetail() {
  sel = null;
  $('preview').replaceChildren();
  delete $('preview').dataset.id;
  $('part').replaceChildren();
  delete $('part').dataset.id;
  $('detail').replaceChildren(el('div', {class: 'empty'}, 'Select an object to see where its chunks are stored.'));
}

function drawEvents(d) {
  const kinds = {'worker-down': 'bad', corrupt: 'bad', lost: 'bad', missing: 'warn', recovery: 'warn', repair: 'ok', 'worker-up': 'ok'};
  $('events').replaceChildren(...d.events.map(e => el('div', null,
    el('time', null, new Date(e.time * 1000).toLocaleTimeString()),
    el('span', null, el('span', {class: 'pill ' + (kinds[e.kind] || 'off')}, e.kind), ' ', e.message),
  )));
  if (!d.events.length) $('events').replaceChildren(el('div', {class: 'empty'}, 'No events yet.'));
}

let busyTick = false;
async function tick() {
  if (busyTick) return;
  busyTick = true;
  try {
    const [c, o, ev] = await Promise.all([get('/cluster'), get('/objects?limit=200'), get('/events?limit=60')]);
    drawCluster(c);
    drawObjects(o);
    drawEvents(ev);
    if (sel) {
      // keep whatever the user is typing in the metadata form across refreshes
      const typing = ['pk', 'pv'].includes(document.activeElement?.id) || $('pk')?.value || $('pv')?.value;
      try {
        const m = await get(`/objects/${sel}/metadata`);
        m.chunks_needed = c.replication_factor;
        drawPreview(m);
        drawPart(m);
        if (!typing || $('detail').dataset.id !== sel) { drawDetail(m, c.workers); $('detail').dataset.id = sel; }
      } catch {
        clearDetail();
      }
    }
  } catch (e) {
    $('stats').replaceChildren(el('span', {class: 'pill bad'}, 'controller unreachable'));
  }
  busyTick = false;
}

$('up').addEventListener('submit', async e => {
  e.preventDefault();
  const f = $('file').files[0], msg = $('upmsg');
  if (!f) return;
  let kv;
  try { kv = parseMeta($('upmeta').value); } catch (err) { msg.textContent = err.message; return; }
  const fd = new FormData();
  fd.append('file', f);
  if (Object.keys(kv).length) fd.append('metadata', JSON.stringify(kv));
  $('upbtn').disabled = true;
  msg.textContent = `Uploading ${f.name}…`;
  try {
    const r = await fetch(API + '/objects', {method: 'POST', body: fd});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error.message);
    msg.textContent = `Stored ${d.name} in ${d.chunk_count} chunk(s).`;
    sel = d.object_id;
    e.target.reset();
  } catch (err) {
    msg.textContent = 'Upload failed: ' + err.message;
  }
  $('upbtn').disabled = false;
  tick();
});

async function del(id) {
  // first click arms the button, second click deletes
  if (armed !== id) { armed = id; tick(); setTimeout(() => { if (armed === id) { armed = null; tick(); } }, 4000); return; }
  armed = null;
  await fetch(`${API}/objects/${id}`, {method: 'DELETE'});
  if (sel === id) clearDetail();
  tick();
}

async function patch(e, id) {
  e.preventDefault();
  const k = $('pk').value.trim(), v = $('pv').value;
  if (!k) return;
  const r = await fetch(`${API}/objects/${id}/metadata`, {
    method: 'PATCH', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({[k]: v === '' ? null : v}),
  });
  if (r.ok) { $('pk').value = ''; $('pv').value = ''; $('pk').blur(); $('pv').blur(); tick(); }
  else $('pmsg').textContent = (await r.json()).error.message;
}

$('scrub').addEventListener('click', async () => {
  $('scrub').disabled = true;
  await fetch(API + '/admin/scrub', {method: 'POST'});
  $('scrub').disabled = false;
  tick();
});

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
